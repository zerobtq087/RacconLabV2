# AppWeb: solo sirve el frontend. El balanceador le manda todo lo que no es /api
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router usa rutas como /usuarios: si no existe el archivo, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de assets llevan hash en el nombre: se pueden guardar en caché
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
