# Raccoon Lab - servicios en Podman (podman-compose). Lo levanta raccoon.sh.
# Las variables ${...} salen del archivo .env de esta misma carpeta (no se sube a git).
# Los laboratorios GNS3 NO están aquí: la API los crea en Docker.

# Configuración común de App1 y App2 (misma imagen, distinto APP_ID)
x-api: &api
  image: localhost/raccoon-api:latest
  restart: always
  depends_on:
    - firebird
    - redis
  networks:
    - raccoon
  # SELinux: un contenedor normal no puede abrir el socket de Docker,
  # por eso SOLO la API corre sin etiqueta. El resto de servicios sigue confinado.
  security_opt:
    - label=disable
  volumes:
    # La API crea los laboratorios hablando con Docker
    - /var/run/docker.sock:/var/run/docker.sock
    # Misma ruta que en el host: Docker monta esas carpetas en los laboratorios
    - ${GNS3_VOLUMES}:${GNS3_VOLUMES}:ro

x-api-env: &api-env
  APP_PORT: ":8080"
  DB_DSN: "SYSDBA:${FIREBIRD_ROOT_PASSWORD}@firebird:3050//var/lib/firebird/data/raccoon.fdb?charset=UTF8"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ADMIN_USER: ${ADMIN_USER}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  GNS3_VOLUMES: ${GNS3_VOLUMES}
  GNS3_WORKSPACE_IMAGE: ${GNS3_WORKSPACE_IMAGE}
  # Para revisar si el GNS3 del laboratorio ya arrancó (puertos publicados en el host)
  GNS3_HOST: host.containers.internal
  GNS3_BASE_PORT: ${GNS3_BASE_PORT}
  LAB_PUERTOS: ${LAB_PUERTOS}
  LABS_MAX: ${LABS_MAX}
  TZ: ${TZ}

services:
  # ---------------- db-engine ----------------
  firebird:
    image: docker.io/firebirdsql/firebird:5.0.3-noble
    container_name: raccoon-firebird
    restart: always
    networks:
      - raccoon
    environment:
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD}
      FIREBIRD_DATABASE: raccoon.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      TZ: ${TZ}
    volumes:
      - firebird_data:/var/lib/firebird/data
      # Solo se aplica la primera vez, cuando se crea la base
      - ../../../../docs/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro,Z

  # Redis SOLO guarda las sesiones de usuario
  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: raccoon-redis
    restart: always
    networks:
      - raccoon
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # ---------------- API (2 réplicas) ----------------
  app1:
    <<: *api
    container_name: raccoon-app1
    environment:
      <<: *api-env
      APP_ID: App1

  app2:
    <<: *api
    container_name: raccoon-app2
    environment:
      <<: *api-env
      APP_ID: App2

  # ---------------- Frontend ----------------
  appweb:
    image: localhost/raccoon-web:latest
    container_name: raccoon-appweb
    restart: always
    networks:
      - raccoon

  # ---------------- Balanceador (único puerto expuesto) ----------------
  nginx:
    image: docker.io/library/nginx:1.28-alpine
    container_name: raccoon-nginx
    restart: always
    depends_on:
      - app1
      - app2
      - appweb
    networks:
      - raccoon
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z

networks:
  raccoon:

volumes:
  firebird_data:
  redis_data:
