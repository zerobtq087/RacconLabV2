# Nginx balanceador (puerto 80): /api va a las 2 réplicas de la API, lo demás a AppWeb.
# Las sesiones están en Redis, así que cualquier réplica atiende a cualquier usuario.
upstream raccoon_api {
    # Memoria compartida: todos los workers de Nginx llevan la misma cuenta
    # del round-robin, así las peticiones se alternan App1, App2, App1...
    zone raccoon_api 64k;
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;
    server_name _;

    # Archivos CSV/Excel de hasta 20 MB (igual que BodyLimit en la API)
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://raccoon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si una réplica no responde, se intenta con la otra
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://appweb:80;
        proxy_set_header Host $host;
    }
}
