---
# =====================================================================
#  Despliega una topología en el GNS3 del laboratorio.
#
#  La API de Go le pasa (con -e):
#    gns3_url, gns3_user, gns3_password  → GNS3 del lab (matrícula + token)
#    project_name                        → nombre del proyecto
#    topology_file                       → JSON ya RESUELTO por Go: cada router trae
#                                          sus interfaces con IP y sus redes, y cada
#                                          host su IP, máscara y gateway.
#  Aquí no se calcula ninguna dirección: solo se aplica lo que dice el JSON.
#  Los nombres de las tareas son los que ve el profesor como "paso" del avance.
# =====================================================================
- name: Desplegar Topologia Dinamica RaccoonLAB
  hosts: localhost
  gather_facts: false

  # El GNS3 server del laboratorio pide usuario y contraseña (token)
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ gns3_user }}"
      url_password: "{{ gns3_password }}"
      force_basic_auth: true
    uri:
      url_username: "{{ gns3_user }}"
      url_password: "{{ gns3_password }}"
      force_basic_auth: true

  tasks:
    - name: Leyendo la topología
      set_fact:
        lab_design: "{{ lookup('file', topology_file) | from_json }}"

    - name: Creando el proyecto en GNS3
      uri:
        url: "{{ gns3_url }}/v2/projects"
        method: POST
        body_format: json
        body:
          name: "{{ project_name }}"
        status_code: [200, 201, 409]
      register: project_status

    - name: Buscando el proyecto existente
      uri:
        url: "{{ gns3_url }}/v2/projects"
        method: GET
      when: project_status.status == 409
      register: existing_projects

    - name: Abriendo el proyecto
      set_fact:
        project_id: "{{ project_status.json.project_id if project_status.status != 409 else (existing_projects.json | selectattr('name', 'equalto', project_name) | map(attribute='project_id') | list | first) }}"

    - name: Asegurando que el proyecto esté abierto
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/open"
        method: POST
        status_code: [200, 201, 204, 400]

    - name: Revisando los nodos del proyecto
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes"
        method: GET
      register: existing_nodes

    - name: Revisando las plantillas de dispositivos
      uri:
        url: "{{ gns3_url }}/v2/templates"
        method: GET
      register: gns3_templates

    # Los hosts (type: docker) son Ubuntu; si la imagen no se cargó, se usa VPCS
    - name: Eligiendo el tipo de host (Ubuntu o VPCS)
      set_fact:
        host_template: "{{ 'Ubuntu RaccoonLAB' if 'Ubuntu RaccoonLAB' in (gns3_templates.json | map(attribute='name') | list) else 'VPCS' }}"

    - name: Creando routers y hosts
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/templates/{{ gns3_templates.json | selectattr('name', 'equalto', (host_template if (item.type | default('')) == 'docker' else item.template)) | map(attribute='template_id') | first }}"
        method: POST
        body_format: json
        body:
          x: "{{ item.x }}"
          y: "{{ item.y }}"
          name: "{{ item.name }}"
          compute_id: "local" # las plantillas integradas (VPCS) no lo traen
        status_code: [201, 409]
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name not in (existing_nodes.json | map(attribute='name') | list)
        - item.type != 'switch'
      register: creation_results

    - name: Poniendo el nombre a cada nodo
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes/{{ item.1.json.node_id }}"
        method: PUT
        body_format: json
        body:
          name: "{{ item.0.name }}"
        status_code: [200, 204]
      loop: "{{ lab_design.nodes | zip(creation_results.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      when:
        - item.1.skipped is not defined
        - item.1.json is defined
        - item.1.json.node_id is defined

    # Puertos del switch: los de "vlans" van en acceso a su VLAN; los que llevan a un
    # router Cisco van como trunk (dot1q) para las subinterfaces. 8 puertos (0-7).
    - name: Calculando los puertos de los switches
      set_fact:
        switch_ports_map: "{{ switch_ports_map | default({}) | combine({ item.name: ports_list }) }}"
      vars:
        ports_list: >-
          {% set ns = namespace(ports=[]) %}
          {% for p in range(0, 8) %}
            {% set port_data = namespace(vlan=1, p_type="access") %}
            {% for v in item.vlans | default([]) %}
              {% if p in (v.ports | default([])) %}
                {% set port_data.vlan = v.id | int %}
              {% endif %}
            {% endfor %}
            {% for link in lab_design.links %}
              {% if (link.node_a == item.name and link.port_a | int == p) or (link.node_b == item.name and link.port_b | int == p) %}
                {% set target_name = link.node_b if link.node_a == item.name else link.node_a %}
                {% set target_node = (lab_design.nodes | selectattr('name', 'equalto', target_name) | list | first) | default({}) %}
                {% if target_node.type is defined and target_node.type == 'cisco' and (item.vlans | default([]) | length > 0) %}
                  {% set port_data.p_type = "dot1q" %}
                  {% set port_data.vlan = 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set _ = ns.ports.append({"port_number": p, "name": "eth" ~ p, "vlan": port_data.vlan | int, "type": port_data.p_type, "ethertype": ("0x8100" if port_data.p_type == "dot1q" else "")}) %}
          {% endfor %}
          {{ ns.ports | to_json }}
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.type == 'switch'

    - name: Creando los switches
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes"
        method: POST
        body_format: json
        status_code: [200, 201, 409]
        body:
          name: "{{ item.name }}"
          node_type: "ethernet_switch"
          compute_id: "local"
          x: "{{ item.x }}"
          y: "{{ item.y }}"
          properties:
            ports_mapping: "{{ switch_ports_map[item.name] | from_json }}"
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name not in (existing_nodes.json | map(attribute='name') | list)
        - item.type == 'switch'

    - name: Leyendo los nodos creados
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes"
        method: GET
      register: final_nodes

    - name: Preparando el mapa de nodos
      set_fact:
        node_map: "{{ dict(final_nodes.json | map(attribute='name') | zip(final_nodes.json | map(attribute='node_id'))) }}"
        node_types: "{{ dict(final_nodes.json | map(attribute='name') | zip(final_nodes.json | map(attribute='node_type'))) }}"
        dynamips_ids: "{{ dict(final_nodes.json | selectattr('node_type', 'equalto', 'dynamips') | map(attribute='name') | zip(final_nodes.json | selectattr('node_type', 'equalto', 'dynamips') | map(attribute='properties.dynamips_id'))) }}"

    - name: Conectando los cables
      ansible.builtin.uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/links"
        method: POST
        status_code: [200, 201, 409]
        body_format: json
        body:
          nodes:
            - node_id: "{{ node_map[item.node_a] }}"
              adapter_number: "{{ 0 if node_types[item.node_a] == 'ethernet_switch' else item.port_a }}"
              port_number: "{{ item.port_a if node_types[item.node_a] == 'ethernet_switch' else (item.port_a_sub | default(0)) }}"
            - node_id: "{{ node_map[item.node_b] }}"
              adapter_number: "{{ 0 if node_types[item.node_b] == 'ethernet_switch' else item.port_b }}"
              port_number: "{{ item.port_b if node_types[item.node_b] == 'ethernet_switch' else (item.port_b_sub | default(0)) }}"
      loop: "{{ lab_design.links }}"
      loop_control:
        label: "{{ item.node_a }} - {{ item.node_b }}"

    # Configuración completa de cada router (templates/cisco_router.j2) como startup-config:
    # es el mismo archivo que abre "Edit config" en GNS3 (configs/i<dynamips_id>_startup-config.cfg),
    # así el router arranca ya configurado (sin telnet ni esperas)
    - name: Configurando los routers
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes/{{ node_map[item.name] }}/files/configs/i{{ dynamips_ids[item.name] }}_startup-config.cfg"
        method: POST
        body: "{{ lookup('template', 'cisco_router.j2') }}"
        status_code: [200, 201]
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.type == 'cisco'

    # Lo mismo que "Edit config" en GNS3: /etc/network/interfaces del host
    - name: Configurando la IP de los hosts Ubuntu
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes/{{ node_map[item.name] }}/files/etc/network/interfaces"
        method: POST
        body: |
          auto eth0
          iface eth0 inet static
              address {{ item.ip }}
              netmask {{ item.netmask }}
          {% if item.gateway | default('') %}
              gateway {{ item.gateway }}
          {% endif %}
        status_code: [200, 201]
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip | default('') }}"
      when:
        - item.type == 'docker'
        - host_template == 'Ubuntu RaccoonLAB'

    - name: Configurando la IP de los hosts VPCS
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes/{{ node_map[item.name] }}/files/startup.vpc"
        method: POST
        body: |
          set pcname {{ item.name }}
          ip {{ item.ip }}/{{ item.prefix }} {{ item.gateway | default('') }}
        status_code: [200, 201]
      loop: "{{ lab_design.nodes }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip | default('') }}"
      when:
        - item.type == 'docker'
        - host_template == 'VPCS'

    - name: Encendiendo todos los nodos
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_id }}/nodes/start"
        method: POST
        status_code: [200, 204]
        timeout: 300
