approvedGitRepositories:
  - "**"

enableScripts: true

# Redes lentas (la de la escuela): más reintentos, más tiempo por petición
# y menos descargas a la vez (por omisión: 3 reintentos, 60 s y 50 a la vez)
httpRetry: 5
httpTimeout: 300000
networkConcurrency: 8

nodeLinker: node-modules

packageExtensions:
  vue-router@*:
    dependencies:
      "@vue/compiler-sfc": "*"

yarnPath: .yarn/releases/yarn-4.14.1.cjs
